<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supervisor Login – Arthi Constructions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0a1628 0%, #1a2a4a 50%, #0d1e38 100%);
      margin: 0;
    }
    .login-wrap {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }
    .login-brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 32px;
      justify-content: center;
    }
    .login-logo {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, #d4a24c, #f0c86a);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 800; color: #0a1628;
    }
    .login-brand-text b { display: block; font-size: 18px; font-weight: 800; color: #fff; letter-spacing: 1px; }
    .login-brand-text span { font-size: 12px; color: rgba(255,255,255,0.5); letter-spacing: 2px; text-transform: uppercase; }
    .login-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 40px 36px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .login-card h2 {
      font-size: 24px; font-weight: 700;
      color: #fff; margin: 0 0 6px;
    }
    .login-card p {
      font-size: 14px; color: rgba(255,255,255,0.5);
      margin: 0 0 28px;
    }
    .field { margin-bottom: 18px; }
    .field label { display: block; font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.7); margin-bottom: 7px; }
    .input-wrap { position: relative; }
    .input-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 16px; pointer-events: none; }
    .field input {
      width: 100%; box-sizing: border-box;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 13px 14px 13px 42px;
      color: #fff; font-size: 15px; font-family: 'Inter', sans-serif;
      outline: none; transition: border 0.2s;
    }
    .field input:focus { border-color: #d4a24c; background: rgba(255,255,255,0.12); }
    .field input::placeholder { color: rgba(255,255,255,0.3); }
    .error-msg {
      background: rgba(220, 53, 69, 0.15);
      border: 1px solid rgba(220, 53, 69, 0.3);
      color: #ff6b6b;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .btn-login {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #d4a24c, #f0c86a);
      border: none; border-radius: 10px;
      font-size: 15px; font-weight: 700;
      color: #0a1628; cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      margin-top: 4px;
    }
    .btn-login:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .demo-hint {
      margin-top: 20px;
      padding: 12px 14px;
      background: rgba(212, 162, 76, 0.1);
      border: 1px solid rgba(212, 162, 76, 0.2);
      border-radius: 10px;
      font-size: 12px; color: rgba(255,255,255,0.6);
      text-align: center;
    }
    .demo-hint b { color: #d4a24c; }
    .back-link { display: block; text-align: center; margin-top: 20px; font-size: 13px; color: rgba(255,255,255,0.4); text-decoration: none; }
    .back-link:hover { color: #d4a24c; }
    .toggle-pass {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; font-size: 16px; color: rgba(255,255,255,0.4);
    }
    .toggle-pass:hover { color: rgba(255,255,255,0.8); }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-brand">
      <div class="login-logo">A</div>
      <div class="login-brand-text">
        <b>ARTHI CONSTRUCTIONS</b>
        <span>Supervisor Portal</span>
      </div>
    </div>

    <div class="login-card">
      <h2>Welcome back</h2>
      <p>Sign in to your Supervisor Dashboard</p>

      <div class="error-msg" id="errorMsg"></div>

      <form id="loginForm">
        <div class="field">
          <label>Username</label>
          <div class="input-wrap">
            <span class="input-icon">👤</span>
            <input type="text" id="username" autocomplete="username" placeholder="Enter your username" required>
          </div>
        </div>
        <div class="field">
          <label>Password</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" id="password" autocomplete="current-password" placeholder="Enter your password" required>
            <button type="button" class="toggle-pass" id="togglePass">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
          <span id="btnText">Sign In</span>
        </button>
      </form>

      <div class="demo-hint">
        Demo — Username: <b>SUPERVISOR</b> · Password: <b>SUPERVISOR</b>
      </div>
    </div>
    <a href="../index.html" class="back-link">← Back to Client Portal</a>
  </div>

  <script>
    const API_BASE = 'https://arthi-backend-xrsh.onrender.com/api';

    document.getElementById('togglePass').addEventListener('click', () => {
      const pw = document.getElementById('password');
      const btn = document.getElementById('togglePass');
      pw.type = pw.type === 'password' ? 'text' : 'password';
      btn.textContent = pw.type === 'password' ? '👁️' : '🙈';
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      const loginBtn = document.getElementById('loginBtn');
      const btnText = document.getElementById('btnText');
      errorMsg.style.display = 'none';

      loginBtn.disabled = true;
      btnText.textContent = 'Signing in...';

      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok && data.user && data.user.role === 'SUPERVISOR') {
          localStorage.setItem('supervisor_token', data.token);
          localStorage.setItem('supervisor_profile', JSON.stringify(data.user));
          window.location.href = 'dashboard.html';
        } else {
          errorMsg.textContent = (data.message && data.user && data.user.role !== 'SUPERVISOR')
            ? 'Access denied: This account does not have supervisor privileges.'
            : (data.message || 'Invalid username or password.');
          errorMsg.style.display = 'block';
          loginBtn.disabled = false;
          btnText.textContent = 'Sign In';
        }
      } catch (err) {
        errorMsg.textContent = 'Failed to connect to server. Make sure the backend is running.';
        errorMsg.style.display = 'block';
        loginBtn.disabled = false;
        btnText.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
